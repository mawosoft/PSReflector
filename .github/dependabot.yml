# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "nuget"
    directories:
      - "/"
      - "/src/Mawosoft.PSReflector"
      - "/tests/Mawosoft.PSReflector.Tests"
      - "/tests/Mawosoft.PSReflector.TestTypes"
    schedule:
      interval: "weekly"
