name: CI/CD

on:
  push:
    branches: master
  pull_request:
    branches: master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  Build:
    outputs:
      deploy: ${{ steps.set_output.outputs.deploy }}
      release: ${{ steps.set_output.outputs.release }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        show-progress: false
        fetch-depth: 0
    - name: Setup dotnet
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: ./global.json
    - name: Build
      id: build
      env:
        MSBuildDebugEngine: 1
        MSBUILDLOGTASKINPUTS: 1
        MSBUILDDEBUGPATH: ./artifacts/binlog
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        dotnet restore
        dotnet build -c Debug --no-restore
        dotnet build -c Release --no-restore
        dotnet pack ./src/Mawosoft.PSReflector/Mawosoft.PSReflector.csproj -c Release --no-build
    - name: Upload Binlogs
      if: ${{ failure() && steps.build.conclusion == 'failure' }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.os }}-binlogs
        path: './artifacts/binlog/*'
    - name: Upload Packages
      if: ${{ matrix.os == 'ubuntu-latest' || strategy.job-total == 1 }}
      uses: actions/upload-artifact@v7
      with:
        name: Packages
        path: ./artifacts/package/release
    - name: Set Deployment and Release Outputs
      id: set_output
      if: ${{ github.event_name == 'push' && (matrix.os == 'ubuntu-latest' || strategy.job-total == 1) }}
      run: |
        [string] $semver = '^(?<major>0|[1-9]\d*)\.(?<minor>0|[1-9]\d*)\.(?<patch>0|[1-9]\d*)(?:-(?<prerelease>(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+(?<buildmetadata>[0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$'
        $docElement = (select-xml -Path ./Directory.Build.props -XPath "/*").Node
        $version = (select-xml -Xml $docElement -XPath "//ns:Version" -Namespace @{ ns = $docElement.NamespaceURI }).Node.InnerText
        if ($version -cnotmatch $semver)
        {
            throw "Invalid Version property."
        }
        # TODO We might allow tags starting with 'rc' or 'pre' to be published to Nuget.
        if ($Matches.prerelease) {
          $deploy = "Azure"
          $release = ""
        }
        else {
          $deploy = "Nuget"
          $release = "v$version"
        }
        Write-Host "Version: $version, Deploy: $deploy, Release: $release"
        echo "deploy=$deploy" >>$env:GITHUB_OUTPUT
        echo "release=$release" >>$env:GITHUB_OUTPUT
    - name: Test
      id: test
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        dotnet test -c Debug --no-build --report-xunit-html
        dotnet test -c Release --no-build --report-xunit-html
    - name: Upload Test Results
      if: ${{ failure() && steps.test.conclusion == 'failure' }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.os }}-testresults
        path: './artifacts/bin/Mawosoft.PSReflector.Tests/*/TestResults/*'
    - name: Coverage
      if: ${{ matrix.os == 'ubuntu-latest' || strategy.job-total == 1 }}
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        $exe = $IsWindows ? '.exe' : ''
        dotnet tool restore
        $param = @(
          "./artifacts/bin/Mawosoft.PSReflector.Tests/debug_net10.0/Mawosoft.PSReflector.Tests$exe"
          '--settings', './tests/Mawosoft.PSReflector.Tests/dotnet-coverage-settings.xml'
          '--output-format', 'cobertura'
          '--output', './artifacts/coverage/dnc-cobertura.xml'
        )
        dotnet dotnet-coverage collect $param
    - name: Upload to codecov
      if: ${{ matrix.os == 'ubuntu-latest' || strategy.job-total == 1 }}
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./artifacts/coverage/dnc-cobertura.xml
        disable_search: true
        disable_telem: true
        verbose: false
        fail_ci_if_error: true

  Deploy:
    needs: Build
    if: ${{ needs.Build.outputs.deploy != '' }}
    runs-on: ubuntu-latest
    steps:
    - name: Download Packages
      uses: actions/download-artifact@v8
      with:
        name: Packages
        path: ./Packages/
    - name: Install Azure Credential Provider
      run: Invoke-Expression "& { $(Invoke-RestMethod https://aka.ms/install-artifacts-credprovider.ps1) }"
    - name: Deploy to Azure
      env:
        VSS_NUGET_EXTERNAL_FEED_ENDPOINTS: '{"endpointCredentials": [{"endpoint":"https://pkgs.dev.azure.com/mawosoft-de/public/_packaging/public/nuget/v3/index.json", "password":"${{ secrets.AZURE_PACKAGE_PAT }}"}]}'
      run: dotnet nuget push ./Packages/*.nupkg --skip-duplicate --source https://pkgs.dev.azure.com/mawosoft-de/public/_packaging/public/nuget/v3/index.json --api-key az

  Publish:
    needs: Build
    if: ${{ needs.Build.outputs.deploy == 'Nuget' }}
    runs-on: ubuntu-latest
    steps:
    - name: Download Packages
      uses: actions/download-artifact@v8
      with:
        name: Packages
        path: ./Packages/
    - name: Publish to Nuget
      run: dotnet nuget push ./Packages/*.nupkg --skip-duplicate --source https://www.powershellgallery.com/api/v2/package/ --api-key ${{ secrets.PSGALLERY_API_KEY }}

  Release:
    needs: Build
    if: ${{ needs.Build.outputs.release != '' }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        show-progress: false
        fetch-depth: 1
    - name: Create GitHub release
      # TODO release notes
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ needs.Build.outputs.release }}
        generate_release_notes: false # false is default. Seems to draw from PRs only.
